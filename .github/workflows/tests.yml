name: ci

on:
  push:
  pull_request:

permissions:
  contents: read            # least privilege for the workflow token

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest --cov=customer_pipeline --cov-report=term --cov-fail-under=90
        env:
          LOG_FILE: ""

  # Same suite against a real PostgreSQL, the production database.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: customers_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest
        env:
          LOG_FILE: ""
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/customers_test

  docker:
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t customer-pipeline:ci .
      - name: smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/ci.db -e API_KEY=ci-key customer-pipeline:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health/ready && break; sleep 1; done
          curl -fs -X POST -H "X-API-Key: ci-key" localhost:8000/pipeline/run
          sleep 2
          curl -fs -H "X-API-Key: ci-key" localhost:8000/stats | grep '"total_customers":10'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/customers)" = "401"
      - if: always()
        run: docker logs api
