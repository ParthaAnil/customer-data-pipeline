[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-pipeline"
version = "1.2.0"
description = "Integrates customer records from a CRM CSV and a billing XML into SQL and serves them over REST."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Partha Anil" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "defusedxml>=0.7",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "pyyaml>=6"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
customer-pipeline = "customer_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using .httpx. with"]
